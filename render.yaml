databases:
  - name: feedo-db
    databaseName: feedo_db
    user: feedo
    plan: free
    region: oregon

services:
  - type: web
    name: feedo-core-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run prisma:generate && npx prisma db push --accept-data-loss && node scripts/seed-all.js && npm run build:api
    startCommand: npm run start:api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: API_PREFIX
        value: api/v1
      - key: DATABASE_URL
        fromDatabase:
          name: feedo-db
          property: connectionString
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: feedo_catalog
      - key: REDIS_URL
        sync: false
      - key: REDIS_TLS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: RAZORPAY_KEY_ID
        sync: false i want all these options 
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
